name: Daily fetch and update

on:
  schedule:
    - cron: '30 20 * * *'  # runs daily at 02:00 IST
  workflow_dispatch: {}    # allow manual runs

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kiteconnect pandas

      - name: Run fetch script
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          python src/fetch_and_update.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily: update trades count"
            git push
          fi

